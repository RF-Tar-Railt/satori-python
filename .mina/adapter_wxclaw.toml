includes = ["src/satori/adapters/wxclaw"]
raw-dependencies = [
    "satori-python-server<1.4.0,>=1.3.7",
    "cryptography>=46.0.4",
]

[project]
name = "satori-python-adapter-wxclaw"
version = "0.1.0"
authors = [
  {name = "KomoriDev", email = "mute231010@gmail.com"}
]
dependencies = []
description = "Satori Protocol SDK for python, adapter for WxClaw"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]

[project.urls]
homepage = "https://github.com/RF-Tar-Railt/satori-python"
repository = "https://github.com/RF-Tar-Railt/satori-python"
